name: Japannext freshness check (temporary)

on:
  # schedule: 一時停止中(PC2からのworkflow_dispatchに一本化。ネイティブcronは信頼性不足のため廃止)
  #   - cron: '3,18,33,48 21,22 * * *'
  #   - cron: '3,13,23,33,43,53 23 * * *'
  #   - cron: '3,13,23,33 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run freshness check
        run: python japannext_freshness_check.py

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japannext_freshness_log.csv
          git diff --cached --quiet || git commit -m "chore: append japannext freshness check result"
          git push
