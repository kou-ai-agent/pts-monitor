name: Japannext freshness check (temporary)

on:
  schedule:
    - cron: '0,15,30,45 21,22 * * *'    # 6:00-7:45 JST, 15分おき
    - cron: '0,10,20,30,40,50 23 * * *' # 8:00-8:50 JST, 10分おき
    - cron: '0,10,20,30 0 * * *'        # 9:00-9:30 JST, 10分おき
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run freshness check
        run: python japannext_freshness_check.py

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japannext_freshness_log.csv
          git diff --cached --quiet || git commit -m "chore: append japannext freshness check result"
          git push
