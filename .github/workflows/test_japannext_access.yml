name: Test Japannext CSV Access

on:
  workflow_dispatch:
  schedule:
    - cron: '53 5 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '3,13,23,33,43,53 6,7,8 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '3 9 * * *'
      timezone: 'Asia/Tokyo'

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch CSVs and record log lines
        run: |
          TS=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')
          TRIGGER="${{ github.event_name }}"

          HTTP_CODE=$(curl -sS -o /tmp/top_ranking.csv -w "%{http_code}" "https://www.japannext.co.jp/csv_download/dnd_top_ranking/NGHT")
          DATE_LINE=$(sed -n '2p' /tmp/top_ranking.csv | tr -d '\r')
          echo "${TS} | trigger=${TRIGGER} | type=top_ranking | http=${HTTP_CODE} | ${DATE_LINE}" >> japannext_watch_log.txt

          HTTP_CODE2=$(curl -sS -o /tmp/market_movers.csv -w "%{http_code}" "https://www.japannext.co.jp/csv_download/dnd_market_movers/NGHT")
          DATE_LINE2=$(sed -n '2p' /tmp/market_movers.csv | tr -d '\r')
          echo "${TS} | trigger=${TRIGGER} | type=market_movers | http=${HTTP_CODE2} | ${DATE_LINE2}" >> japannext_watch_log.txt

      - name: Commit and push with retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japannext_watch_log.txt
          git commit -m "test: japannext watch log entry [skip ci]" || echo "no changes to commit"
          for i in 1 2 3; do
            if git push; then
              echo "push succeeded on attempt $i"
              break
            fi
            echo "push failed, attempt $i/3. pulling and retrying..."
            git pull --rebase origin HEAD
            sleep 5
          done
