name: Daily PTS Monitor Fetch

on:
  # schedule: 一時停止中(株探スクレイピングがブロックされ続けているため。Japannext移行完了後に再開予定)
  #   - cron: '33 15 * * 1-5'
  #   - cron: '33 16 * * 1-5'
  #   - cron: '33 17 * * 1-5'
  workflow_dispatch: # 手動実行用トグル

permissions:
  contents: write

jobs:
  run-batch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright (diagnostic - temporary)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Playwright diagnostic test (kabutan.jp bot detection - temporary)
        continue-on-error: true
        run: python playwright_test.py

      - name: Run daily pipeline (Scraper -> Processor -> AI Agent -> Notifier)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PTS_DISCORD_WEBHOOK_URL: ${{ secrets.PTS_DISCORD_WEBHOOK_URL }}
          PTS_SLACK_WEBHOOK_URL: ${{ secrets.PTS_SLACK_WEBHOOK_URL }}
          PTS_LINE_ACCESS_TOKEN: ${{ secrets.PTS_LINE_ACCESS_TOKEN }}
        run: python main.py

      - name: Generate changelog from today's commits
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python changelog_generator.py

      - name: Cleanup old data (keep past 30 days)
        run: |
          echo "Cleaning up files older than 30 days in docs/data/ directory..."
          find docs/data -name "*.json" ! -name "index.json" ! -name "changelog_state.json" -mtime +30 -exec rm {} \;

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "Automated daily PTS data update"
          file_pattern: "docs/data/*.json"
